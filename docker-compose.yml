services:
  mysql:
    image: mysql:8.0
    container_name: erp-mysql-events
    command: --event-scheduler=ON
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: erp
      MYSQL_USER: erp
      MYSQL_PASSWORD: erp
    ports:
      - "3306:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uerp", "-perp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
